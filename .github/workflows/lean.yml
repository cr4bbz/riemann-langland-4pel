name: Lean build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
      - name: Reject proof placeholders
        run: |
          if grep -R -n -E '\b(sorry|admit|axiom)\b' RiemannHypothesisLean RiemannHypothesisLean.lean; then
            exit 1
          fi
